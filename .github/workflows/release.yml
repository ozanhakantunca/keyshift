name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify version and branch
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on origin/main; refusing to release."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: swift test --force-resolved-versions
      - name: Configure signing
        shell: bash
        env:
          KEYSHIFT_CERT_P12_BASE64: ${{ secrets.KEYSHIFT_CERT_P12_BASE64 }}
          KEYSHIFT_CERT_P12_PASSWORD: ${{ secrets.KEYSHIFT_CERT_P12_PASSWORD }}
        run: |
          if [[ -z "$KEYSHIFT_CERT_P12_BASE64" ]]; then
            echo '::error::KEYSHIFT_CERT_P12_BASE64 is not set. Refusing to ship an ad-hoc-signed release: it has a different designated requirement and would reset every user'"'"'s Accessibility and Input Monitoring grants.'
            exit 1
          fi
          p12="$RUNNER_TEMP/keyshift-cert.p12"
          trap 'rm -f "$p12"' EXIT
          kc="$RUNNER_TEMP/keyshift-signing.keychain-db"
          pw=$(openssl rand -hex 32)
          echo "$KEYSHIFT_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$pw" "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security import "$p12" -k "$kc" -P "$KEYSHIFT_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          existing=()
          while IFS= read -r line; do
            line="${line#\"}"
            line="${line%\"}"
            existing+=("$line")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          echo 'KEYSHIFT_SIGN_IDENTITY=Keyshift Self-Signed' >> "$GITHUB_ENV"
      - run: scripts/build-app.sh --arch universal
      - run: scripts/make-dmg.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Notes: this version's CHANGELOG section. Not a prerelease, so releases/latest (README link)
          # resolves to it.
          awk -v v="$VERSION" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run: replace the assets of the existing release.
            gh release upload "$GITHUB_REF_NAME" dist/Keyshift-*.dmg dist/Keyshift-*.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Keyshift-*.dmg dist/Keyshift-*.dmg.sha256 --title "Keyshift $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/keyshift-signing.keychain-db" || true
