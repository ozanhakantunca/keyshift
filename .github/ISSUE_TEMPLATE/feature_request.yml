name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, and what you do today instead.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: For a new rule or action, an example of the config you would write.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
